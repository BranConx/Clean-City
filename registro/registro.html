 Descripción: Estructura HTML de la interfaz del sistema.
-->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanCity - Registro</title>
    <link rel="stylesheet" href="../assets/css/style.css?v=2">
    <link rel="stylesheet" href="../registro/registro.css">
    <script>
        if (localStorage.getItem("usuarioCleanCity")) {
            window.location.href = "../inicio/inicio.html";
        }
    </script>
</head>
<body>
    <div class="container">

        <div class="col-left">
            <div class="brand">
                <div class="logo-icon">♻️</div>
                <h1 class="brand-title">CleanCity</h1>
                <p class="brand-subtitle">Tu ciudad, más limpia.</p>
                <div class="brand-message">
                    <p>Recibe notificaciones exactas cuando el camión de basura esté cerca de tu hogar.</p>
                </div>
            </div>
        </div>

        <div class="col-right">
            <div class="form-wrapper">
                <h2 class="form-title">Crear cuenta</h2>
                <p class="form-subtitle">Regístrate para comenzar a recibir alertas.</p>

                <div class="campo">
                    <label class="campo-label">Nombre completo</label>
                    <input type="text" id="regNombre" class="campo-input" placeholder="Ej. Juan Pérez">
                </div>

                <div class="campo">
                    <label class="campo-label">Correo electrónico</label>
                    <input type="email" id="regEmail" class="campo-input" placeholder="correo@ejemplo.com">
                </div>

                <div class="campo">
                    <label class="campo-label">Teléfono</label>
                    <input type="tel" id="regTelefono" class="campo-input" placeholder="+57 300 123 4567">
                </div>

                <div class="campo">
                    <label class="campo-label">Contraseña</label>
                    <input type="password" id="regPassword" class="campo-input" placeholder="••••••••">
                </div>

                <div class="campo">
                    <label class="campo-label">Confirmar</label>
                    <input type="password" id="regConfirm" class="campo-input" placeholder="••••••••">
                </div>

                <button id="btnRegistro" class="btn-registrar">Registrarse ahora</button>

                <p class="login-link">¿Ya tienes cuenta? <a href="../login/login.html">Inicia sesión</a></p>
            </div>
        </div>

    </div>

    <script src="../assets/js/script.js?v=2"></script>
    <script src="../registro/registro.js"></script>
</body>
</html>
